services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fpv_planeamento
      POSTGRES_USER: fpv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cria o ficheiro .env com POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpv -d fpv_planeamento"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [private]

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      PORT: "3000"
      # Secure por defeito. Só desativar explicitamente em testes HTTP locais.
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      DATABASE_URL: "postgresql://fpv:${POSTGRES_PASSWORD}@db:5432/fpv_planeamento?schema=public"
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  web:
    build: ./apps/web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on: [api]
    networks: [private]

volumes:
  pgdata:

networks:
  private:
    driver: bridge
