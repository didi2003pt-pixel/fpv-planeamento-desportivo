name: CI - build e Docker
on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  build-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências da API
        run: npm install --no-audit --no-fund
      - name: Validar schema Prisma
        env:
          DATABASE_URL: postgresql://fpv:local@localhost:5432/fpv_planeamento?schema=public
        run: npm run prisma:validate
      - name: Gerar cliente Prisma
        run: npm run prisma:generate
      - name: Compilar API
        run: npm run build
      - name: Testar hashes de password e sessões
        run: npm run test:auth
      - name: Testar regras de acesso e validação das atividades
        run: npm run test:activities
      - name: Testar validações de contas e atribuições
        run: npm run test:admin

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências web
        run: npm install --no-audit --no-fund
      - name: Testar mapa mensal por classe
        run: npm run test:mapa
      - name: Testar criação de atividades e participantes
        run: npm run test:form
      - name: Testar vistas fictícias de treinadores e classes
        run: npm run test:coaches
      - name: Validar contadores por período do calendário
        run: npm run test:calendar
      - name: Testar comparação anual e confirmação mensal
        run: npm run test:monthly
      - name: Testar cliente API da área privada
        run: npm run test:private
      - name: Testar ligação Microsoft Graph sem dados reais
        run: npm run test:m365
      - name: Verificar TypeScript e compilar interface
        run: npm run build
      - name: Verificar build estático do GitHub Pages
        run: npm run build -- --mode pages

  smoke-docker:
    runs-on: ubuntu-latest
    # Instância temporária e base de dados descartável, nunca dados reais.
    env:
      POSTGRES_PASSWORD: ci_test_password_123
      APP_PORT: '8080'
      SESSION_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir e iniciar containers
        run: docker compose up --build -d
      - name: Verificar comunicação entre nginx e API
        shell: bash
        run: |
          for i in $(seq 1 35); do
            if curl --fail --silent http://localhost:8080/api/health | grep -q '"status":"ok"'; then
              echo "API acessível através do frontend"
              exit 0
            fi
            sleep 3
          done
          echo "Health check não respondeu a tempo"
          exit 1
      - name: Verificar rota privada no nginx de Docker
        shell: bash
        run: |
          curl --fail --silent --show-error http://localhost:8080/gestao -o /tmp/fpv-gestao.html
          grep -q '<div id="root"' /tmp/fpv-gestao.html
          rm -f /tmp/fpv-gestao.html
      - name: Testar migração PostgreSQL e sessão protegida
        shell: bash
        run: |
          docker compose exec -T db psql -U fpv -d fpv_planeamento -tAc "SELECT to_regclass('public.auth_sessions') IS NOT NULL" | grep -qx t
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me)" = "401"
          docker compose exec -T -e FPV_LOCAL_BOOTSTRAP=1 -e FPV_INITIAL_ADMIN_EMAIL=admin@fpv.invalid -e FPV_INITIAL_ADMIN_PASSWORD='TesteSomenteNoCI_2026#Fortissima' api node dist/bootstrap-admin.js
          curl --fail --silent --show-error -c /tmp/fpv-session.txt \
            -H 'Content-Type: application/json' \
            --data '{"email":"admin@fpv.invalid","password":"TesteSomenteNoCI_2026#Fortissima"}' \
            http://localhost:8080/api/auth/login | grep -q '"role":"ADMIN"'
          curl --fail --silent --show-error -b /tmp/fpv-session.txt \
            http://localhost:8080/api/auth/me | grep -q '"role":"ADMIN"'
          curl --fail --silent --show-error -b /tmp/fpv-session.txt \
            -H 'Content-Type: application/json' --data '{}' \
            http://localhost:8080/api/auth/logout | grep -q '"signed_out"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/fpv-session.txt http://localhost:8080/api/auth/me)" = "401"
          rm -f /tmp/fpv-session.txt
      - name: Testar atividades, permissões e auditoria no PostgreSQL
        shell: bash
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U fpv -d fpv_planeamento < apps/api/tests/fixtures.sql
          node apps/api/tests/activities.integration.mjs
          docker compose exec -T db psql -U fpv -d fpv_planeamento -tAc 'SELECT COUNT(*) FROM activity_changes' | grep -qx 3
      - name: Testar administração de contas e revogação de acessos
        shell: bash
        run: |
          node apps/api/tests/admin.integration.mjs
          docker compose exec -T db psql -U fpv -d fpv_planeamento -tAc 'SELECT COUNT(*) FROM admin_changes' | grep -qx 6

      - name: Mostrar diagnóstico em caso de falha
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100 api web db
      - name: Parar containers
        if: always()
        run: docker compose down -v
