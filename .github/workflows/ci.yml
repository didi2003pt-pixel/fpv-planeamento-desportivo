name: CI - compilação inicial
on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  build-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências da API
        run: npm install --no-audit --no-fund
      - name: Validar schema Prisma
        env:
          DATABASE_URL: postgresql://fpv:local@localhost:5432/fpv_planeamento?schema=public
        run: npm run prisma:validate
      - name: Compilar API
        run: npm run build

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências web
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript e compilar interface
        run: npm run build
